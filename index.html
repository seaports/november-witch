    <style>
        /* Page-specific styles for index only.
           Resets, fonts, body background/noise, .seo-text, and the
           centered-container pattern all live in styles.css now
           (.container-centered covers the flex-centered layout below). */

        .nav-grid {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-item {
            position: relative;
            width: 280px;
            aspect-ratio: 14 / 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-door {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.2s ease-in-out;
        }

        /* Hover effects for interactivity */
        .nav-door[data-door="wooden"]:hover { content: url("assets/woodenopen.png"); }
        .nav-door[data-door="horse"]:hover { content: url("assets/horseopen.png"); }
        .nav-door[data-door="victorian"]:hover { content: url("assets/victorianopen.png"); }

        .nav-overlay {
            animation: floatY 4s ease-in-out infinite;
            position: absolute;
            width: 70%;
            height: auto;
            pointer-events: none;
            mix-blend-mode: difference;
            filter: drop-shadow(0 0 6px white) drop-shadow(0 0 10px white);
            z-index: 1;
            top: 10%;
            transform: translateY(-10%) translateY(0);
        }

        /* Index-only fixed dual-logo header (distinct from the shared
           .header component used on inner pages, so given its own class) */
        .site-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .site-header img:first-child {
            height: 80px;
        }

        .site-header img:last-child {
            height: 100px;
        }

        @media (max-width: 768px) {
            .container-centered {
                padding: 220px 20px 60px 20px;
            }

            .nav-grid {
                flex-direction: column;
                gap: 50px;
            }

            .nav-item {
                width: 260px;
            }

            .site-header {
                position: absolute;
                top: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .site-header img:first-child,
            .site-header img:last-child {
                height: 70px;
            }
        }

        .click-effect {
            position: fixed;
            pointer-events: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            z-index: 1001;
            animation: clickRipple 0.6s ease-out forwards;
        }

        @keyframes clickRipple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Hidden SEO text: crawlable by Google, invisible to visitors -->
    <h1 class="seo-text">November Witch — Folk Electronica Rock Band from London, Ontario</h1>
    <p class="seo-text">November Witch is a folk electronica rock band from London, Ontario. Listen to singles 'Orion' and 'Selena', and watch for their forthcoming 2026 EP 'A Farm w/ No Horses'. Find show dates, music, and booking info.</p>

    <div class="site-header">
        <img src="assets/textlogo.png" alt="November Witch text logo"/>
        <img src="assets/logo.png" alt="November Witch band logo — folk electronica rock band from London, Ontario"/>
    </div>

    <div class="container-centered">
        <div class="nav-grid">
            <a href="about.html" class="nav-item" aria-label="About November Witch">
                <img src="assets/woodenclosed.png" class="nav-door" data-door="wooden" alt="A closed wooden door that opens on hover, revealing a glowing portal to the About page." />
                <img src="assets/about.png" class="nav-overlay" alt="The word 'About' floating."/>
            </a>

            <a href="shows.html" class="nav-item" aria-label="November Witch live shows and tour dates">
                <img src="assets/horseclosed.png" class="nav-door" data-door="horse" alt="A closed door with a horse knocker that opens on hover, revealing a glowing portal to the Shows page." />
                <img src="assets/shows.png" class="nav-overlay" alt="The word 'Shows' floating."/>
            </a>

            <a href="contact.html" class="nav-item" aria-label="Contact November Witch for booking and press">
                <img src="assets/victorianclosed.png" class="nav-door" data-door="victorian" alt="A closed victorian door that opens on hover, revealing a glowing portal to the Contact page." />
                <img src="assets/contact.png" class="nav-overlay" alt="The word 'Contact' floating."/>
            </a>
        </div>
    </div>

    <script>
        // Sound and Visual Effects
        function playClickSound() {
            const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBzJhw7rQ');
            audio.volume = 0.1;
            audio.play().catch(() => {});
        }

        function createClickEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.style.left = (x - 10) + 'px';
            effect.style.top = (y - 10) + 'px';
            document.body.appendChild(effect);
            setTimeout(() => document.body.removeChild(effect), 600);
        }

        // Add click handlers to each navigation door
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                playClickSound();
                createClickEffect(e.clientX, e.clientY);
            });
        });

        // Add a generic click effect for clicks anywhere else on the page
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.nav-item')) {
                createClickEffect(e.clientX, e.clientY);
                playClickSound();
            }
        });
    </script>
</body>
