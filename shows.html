<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shows - November Witch</title>
    <meta name="description" content="November Witch is a folk electronica rock band from London, Ontario. Listen to our latest singles 'Orion' and 'Selena', and follow the upcoming 2026 EP 'A Farm w/ No Horses'.">
    <meta name="keywords" content="November Witch, November Witch band, folk electronica rock band London Ontario, Canadian indie rock band, gothic folk band Canada, Orion November Witch, Selena November Witch, A Farm w No Horses EP, London Ontario music scene">

    <meta property="og:type" content="website">
    <meta property="og:title" content="November Witch | Folk Electronica Rock Band | London, Ontario">
    <meta property="og:description" content="November Witch is a folk electronica rock band from London, Ontario. Explore our music, members, show dates, and upcoming releases.">
    <meta property="og:image" content="https://www.novemberwitch.com/assets/logo.png">
    <meta property="og:site_name" content="November Witch">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="November Witch | Folk Electronica Rock Band | London, Ontario">
    <meta name="twitter:description" content="Folk electronica rock from London, Ontario. Stream 'Orion' and 'Selena' and check out upcoming tour dates.">
    <meta name="twitter:image" content="https://www.novemberwitch.com/assets/logo.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "November Witch",
      "url": "https://www.novemberwitch.com",
      "logo": "https://www.novemberwitch.com/assets/logo.png",
      "genre": ["Folk", "Electronica", "Gothic Rock", "Indie Rock"],
      "foundingLocation": {
        "@type": "Place",
        "name": "London, Ontario, Canada"
      },
      "member": [
        { "@type": "Person", "name": "Millie" },
        { "@type": "Person", "name": "Jazz" },
        { "@type": "Person", "name": "Ben" },
        { "@type": "Person", "name": "Jack" }
      ],
      "album": [
        {
          "@type": "MusicAlbum",
          "name": "A Farm w/ No Horses",
          "albumReleaseType": "EP",
          "datePublished": "2026"
        }
      ],
      "track": [
        { "@type": "MusicRecording", "name": "Orion" },
        { "@type": "MusicRecording", "name": "Selena" }
      ]
    }
    </script>
    <link rel="icon" type="image/x-icon" href="/assets/novwitchfavicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
    <style>
        /* Base styles matching about page */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .dm-serif-text-regular { font-family: "DM Serif Text", serif; font-weight: 400; font-style: normal; }
        .dm-serif-text-regular-italic { font-family: "DM Serif Text", serif; font-weight: 400; font-style: italic; }
        
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        
        body { 
            font-family: 'DM Serif Text', monospace; 
            background: radial-gradient(circle at center, #2d89e1, #15596c);
            color: #e6e6e6; 
            cursor: crosshair; 
            min-height: 100vh; 
            padding: 20px;
            position: relative;
        }
        
        body::before { 
            content: ""; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 95 95'><filter id='noiseFilter'><feTurbulence type='fractalNoise' baseFrequency='0.74' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23noiseFilter)'/></svg>"); 
            background-size: cover; 
            opacity: 0.035; 
            z-index: -1; 
            pointer-events: none; 
        }
        
        .container { 
            max-width: 1200px; 
            margin: 80px auto 40px auto;
            position: relative; 
            z-index: 10; 
        }
        
        .back-door-container {
            position: relative;
            width: 100px;
            height: auto;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0 20px 0;
        }
        
        .back-door {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
            transition: content 0.2s ease-in-out;
        }
        
        .back-door[data-door="horse"]:hover { content: url("assets/horseopen.png"); }
        
        .back-overlay {
            animation: floatY 4s ease-in-out infinite;
            position: absolute;
            width: 70%;
            height: auto;
            pointer-events: none;
            mix-blend-mode: difference;
            filter: drop-shadow(0 0 6px white) drop-shadow(0 0 10px white);
            z-index: 1;
            top: 10%;
            transform: translateY(-10%) translateY(0);
        }
        @keyframes floatY { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header img { height: 100px; width: auto; display: block; margin: 0 auto; }

        .shows-section {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .section-title { 
            font-size: 20px; 
            color: #ccccee; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-align: center; 
        }

        .shows-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
        }

        .show-item { 
            border: 1px solid #4a4a6a; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            overflow: hidden;
            position: relative;
        }

        .show-item:hover { 
            border-color: #6a6a8a; 
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Future show styling - brighter, more vibrant */
        .show-item.future { 
            background: linear-gradient(45deg, #4a4a7a, #3a3a6a); 
        }
        .show-item.future:hover { 
            background: linear-gradient(45deg, #5a5a8a, #4a4a7a); 
        }
        .show-item.future .show-title { color: #ffffff; }
        .show-item.future .show-date { color: #ddddff; }
        .show-item.future .show-venue { color: #bbbbdd; }

        /* Past show styling - more muted, sepia-toned */
        .show-item.past { 
            background: linear-gradient(45deg, #3a3a5a, #2a2a4a); 
            opacity: 0.85;
        }
        .show-item.past:hover { 
            background: linear-gradient(45deg, #4a4a6a, #3a3a5a); 
            opacity: 1;
        }
        .show-item.past .show-title { color: #cccccc; }
        .show-item.past .show-date { color: #aaaaaa; }
        .show-item.past .show-venue { color: #888888; }
        .show-item.past::after {
            content: "PAST";
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #888888;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .show-image {
            width: 100%;
            aspect-ratio: 4/5;
            background: linear-gradient(45deg, #2a2a4a, #1a1a3a);
            border-bottom: 1px solid #4a4a6a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a8aaa;
            font-size: 14px;
            overflow: hidden;
            position: relative;
        }

        .show-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .show-details {
            padding: 20px;
        }

        .show-title {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .show-date {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .show-venue {
            font-size: 14px;
            opacity: 0.8;
        }

        .no-shows {
            text-align: center;
            color: #aaaacc;
            font-size: 16px;
            padding: 40px 20px;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border: 2px solid #6a6a8a;
            border-radius: 8px;
            color: #ccccee;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 800px;
            max-height: 90vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 20px 0 20px;
            text-align: center;
        }

        .modal-title {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .modal-details {
            font-size: 16px;
            color: #ccccee;
            margin-bottom: 20px;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
        
            aspect-ratio: unset;
        
            max-height: 80vh;
        
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .carousel-image {
            width: 100%;
            height: auto;
        
            max-height: 80vh;
        
            object-fit: contain;
            display: none;
        }
        
        .carousel-image.active {
            display: block;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            font-size: 24px;
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .carousel-nav:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .carousel-prev { left: 10px; }
        .carousel-next { right: 10px; }

        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .carousel-dot.active {
            background: white;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }

        .modal-close:hover {
            opacity: 0.7;
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                padding: 10px;
            }
            
            .container {
                margin: 40px auto 40px auto;
            }
            
            .header img { 
                height: 70px;
            }
            
            .back-door-container { 
                width: 80px;
            }
            
            .shows-section {
                padding: 20px;
            }
            
            .shows-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .modal-content {
                width: 95vw;
                max-height: 85vh;
            }

            .carousel-nav {
                font-size: 18px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-door-container">
            <img src="assets/horseclosed.png" class="back-door" data-door="horse" alt="A closed door with a horse knocker that opens on hover, revealing a glowing portal back to the home page." />
            <img src="assets/back.png" class="back-overlay" alt="The word 'Back' floating."/>
        </a>

        <div class="header">
            <img src="assets/shows.png" alt="Shows Page"/>
        </div>

        <div class="shows-section">
            <h2 class="section-title">Upcoming Shows</h2>
            <div id="upcoming-shows-container"></div>
        </div>

        <div class="shows-section">
            <h2 class="section-title">Past Shows</h2>
            <div id="past-shows-container"></div>
        </div>
    </div>

    <script>
        let currentCarouselIndex = 0;

        function createShowCard(show, type) {
            const item = document.createElement('div');
            item.className = `show-item ${type}`;
            item.setAttribute('data-folder', show.folder);
            item.setAttribute('data-image-count', show.imageCount);

            item.innerHTML = `
                <div class="show-image">
                    <img src="assets/shows/${show.folder}/1.jpg" alt="${show.title}" onerror="this.style.display='none'; this.parentNode.innerHTML='Show Image ${type === 'past' ? 'Archive' : 'Coming Soon'}';">
                </div>
                <div class="show-details">
                    <div class="show-title">${show.title}</div>
                    <div class="show-date">${show.date}</div>
                    <div class="show-venue">${show.venue}</div>
                </div>
            `;

            item.addEventListener('click', () => openModal(show));
            return item;
        }

        function openModal(show) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'block';

            let carouselImagesHTML = '';
            let carouselDotsHTML = '';

            for (let i = 1; i <= show.imageCount; i++) {
                const activeClass = i === 1 ? 'active' : '';
                carouselImagesHTML += `<img src="assets/shows/${show.folder}/${i}.jpg" class="carousel-image ${activeClass}" alt="${show.title} Photo ${i}" onerror="this.style.display='none';">`;
                carouselDotsHTML += `<div class="carousel-dot ${activeClass}" onclick="showCarouselImage(${i - 1})"></div>`;
            }

            const content = document.createElement('div');
            content.className = 'modal-content';
            content.innerHTML = `
                <div class="modal-close">&times;</div>
                <div class="modal-header">
                    <h2 class="modal-title">${show.title}</h2>
                    <div class="modal-details">${show.date} • ${show.venue}</div>
                </div>
                <div class="carousel-container">
                    ${carouselImagesHTML}
                    ${show.imageCount > 1 ? `
                        <button class="carousel-nav carousel-prev" onclick="prevCarouselImage()">&lt;</button>
                        <button class="carousel-nav carousel-next" onclick="nextCarouselImage()">&gt;</button>
                        <div class="carousel-indicators">${carouselDotsHTML}</div>
                    ` : ''}
                </div>
            `;

            modal.appendChild(content);
            document.body.appendChild(modal);
            currentCarouselIndex = 0;

            content.querySelector('.modal-close').addEventListener('click', () => document.body.removeChild(modal));
            modal.addEventListener('click', (e) => { if (e.target === modal) document.body.removeChild(modal); });
        }

        function showCarouselImage(index) {
            const images = document.querySelectorAll('.carousel-image');
            const dots = document.querySelectorAll('.carousel-dot');
            images.forEach(img => img.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            if (images[index]) {
                images[index].classList.add('active');
                dots[index].classList.add('active');
                currentCarouselIndex = index;
            }
        }

        function nextCarouselImage() {
            const images = document.querySelectorAll('.carousel-image');
            showCarouselImage((currentCarouselIndex + 1) % images.length);
        }

        function prevCarouselImage() {
            const images = document.querySelectorAll('.carousel-image');
            showCarouselImage((currentCarouselIndex - 1 + images.length) % images.length);
        }

        document.addEventListener('keydown', function (e) {
            const modal = document.querySelector('.modal');
            if (e.key === 'Escape' && modal) document.body.removeChild(modal);
            else if (e.key === 'ArrowRight' && modal) nextCarouselImage();
            else if (e.key === 'ArrowLeft' && modal) prevCarouselImage();
        });

        // Load shows from JSON
        fetch('shows.json')
            .then(res => res.json())
            .then(data => {
                // Upcoming shows
                const upcomingContainer = document.getElementById('upcoming-shows-container');
                if (data.upcoming && data.upcoming.length > 0) {
                    const grid = document.createElement('div');
                    grid.className = 'shows-grid';
                    data.upcoming.forEach(show => grid.appendChild(createShowCard(show, 'future')));
                    upcomingContainer.appendChild(grid);
                } else {
                    upcomingContainer.innerHTML = '<p class="no-shows">No shows currently planned.</p>';
                }

                // Past shows
                const pastContainer = document.getElementById('past-shows-container');
                if (data.past && data.past.length > 0) {
                    const grid = document.createElement('div');
                    grid.className = 'shows-grid';
                    data.past.forEach(show => grid.appendChild(createShowCard(show, 'past')));
                    pastContainer.appendChild(grid);
                } else {
                    pastContainer.innerHTML = '<p class="no-shows">No past shows recorded.</p>';
                }
            })
            .catch(err => {
                console.error('Failed to load shows.json:', err);
                document.getElementById('upcoming-shows-container').innerHTML = '<p class="no-shows">Could not load shows.</p>';
                document.getElementById('past-shows-container').innerHTML = '<p class="no-shows">Could not load shows.</p>';
            });
    </script>
</body>
</html>
